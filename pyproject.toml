[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-eval-dataset-generator"
version = "0.2.0"
description = "Synthetic evaluation dataset generator with multi-provider PCL support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sumit Dalavi" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.14.0",
    "nltk>=3.8.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.24.0"
]

[project.scripts]
eval-gen = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
